name: CI/CD

on:
    push:
        branches:
            - main

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Install dependencies
                run: composer install

            -   name: Run PHP CS Fixer
                run: |
                    php-cs-fixer fix --diff --dry-run .

    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Run tests
                run: php bin/phpunit

